name: rosenweg_wetter
description: "Rosenweg Wetter – Wetterstation am Rosenweg 9: aktuelle Werte live, Verlauf bis 7 Tage, Sonne und Mond."
publish_to: 'none'

# version: x.y.z+Baunummer. Ein Merge auf main mit einer NEUEN Version (Tag
# vx.y.z gibt es noch nicht) baut alle Plattformen und veroeffentlicht sie
# (GitHub-Release, /apps). Unveraenderte Version = nur CI, kein Release.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Gemeinsame Basis der Rosenweg-Apps: Anmeldung (Karte, QR, Konto, still per
  # Kerberos), API, Gerüst (Handy/Desktop), Updater, Logo-Baukasten.
  # Oeffentliches Repo: pub holt es ohne Token; lokal mit ../rosenweg-basis
  # ueber pubspec_overrides.yaml (siehe README, "Entwickeln").
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      # Commit aus PR #34 (Bausteine Diagramme und Echtzeit/MQTT). Sobald der
      # Integrator die Fassung taggt: hier den Tag eintragen.
      ref: c36e47fd42327c870ff9aa4cbf9473a504bd2b73

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Logo fuer Anmeldeschirm, "Über" und Titelleiste (assets/logo/erzeugen.sh)
  assets:
    - assets/logo/rosenweg-wetter-512.png
    - assets/logo/rosenweg-wetter-klein.png
